<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="클럽원 점수와 참가 인원을 관리하고 무작위로 팀을 편성하는 앱">
  <meta name="theme-color" content="#1976D2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="팀짜기">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=4">
  <link rel="icon" type="image/png" href="favicon.png?v=4">
  <link rel="manifest" href="manifest.json">
  <title>블랙홀 팀짜기</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    #loading-indicator {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    #loading-indicator::after {
      width: 36px;
      height: 36px;
      content: '';
      border: 4px solid #d9e2f7;
      border-top-color: #3367d6;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" role="progressbar" aria-label="Loading"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service_worker.js', {
          updateViaCache: 'none',
        });
      });
    }
  </script>
</body>
</html>
